name: Supabase Keep-Alive

# يمنع توقف مشروع Supabase (الخطة المجانية) بسبب عدم النشاط لمدة 7 أيام،
# عن طريق عمل استعلام بسيط وآمن (قراءة صف واحد فقط) مرتين أسبوعيًا.

on:
  schedule:
    # كل اثنين وخميس الساعة 6 صباحًا بتوقيت غرينتش (هامش أمان كبير قبل حد الـ 7 أيام)
    - cron: '0 6 * * 1,4'
  workflow_dispatch: # يسمح بتشغيله يدويًا من تبويب Actions للتجربة

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping licenses table (lightweight read-only query)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/licenses?select=license_key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Supabase ping failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Supabase project pinged successfully — inactivity timer reset."
